<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Tools - AI Tools Hub</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
    <link rel="stylesheet" href="assets/css/themes.css">
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/animations.css">
    <script>
        /* Instant Anti-Flicker & Theme Check */
        (function () {
            // 1. Theme Check (Remembers user preference or system default)
            var theme = localStorage.getItem('theme');
            if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }

            // 2. Auth Check
            var c = localStorage.getItem('cachedUser');
            if (c) {
                document.documentElement.classList.add('is-logged-in');
                try { if (JSON.parse(c).isAdmin) document.documentElement.classList.add('is-admin'); } catch (e) { }
            } else {
                document.documentElement.classList.add('is-logged-out');
            }
        })();
    </script>
    <style>
        .tools-hero {
            padding: 120px 0 60px;
            background: var(--bg-gradient-hero);
            text-align: center
        }

        .search-box {
            display: flex;
            background: var(--bg-card);
            border-radius: var(--radius-2xl);
            box-shadow: var(--shadow-xl);
            overflow: hidden;
            border: 2px solid var(--border-light);
            transition: all var(--duration-base);
            max-width: 700px;
            margin: 0 auto
        }

        .search-box:focus-within {
            border-color: var(--accent-primary);
            box-shadow: var(--shadow-primary)
        }

        .search-input {
            flex: 1;
            padding: var(--space-5) var(--space-6);
            border: none;
            background: transparent;
            font-size: var(--text-lg);
            font-family: var(--font-primary);
            color: var(--text-primary);
            outline: none
        }

        .search-btn {
            padding: var(--space-4) var(--space-6);
            background: var(--bg-gradient-1);
            border: none;
            color: white;
            font-size: var(--text-xl);
            cursor: pointer
        }

        .filters-section {
            padding: var(--space-6) 0;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-light);
            position: sticky;
            top: 72px;
            z-index: var(--z-sticky);
            backdrop-filter: blur(10px)
        }

        .filters-wrapper {
            display: flex;
            gap: var(--space-4);
            align-items: center;
            flex-wrap: wrap
        }

        .filter-select {
            padding: var(--space-2) var(--space-4);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            background: var(--bg-card);
            color: var(--text-primary);
            outline: none
        }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: var(--space-6);
            padding: var(--space-10) 0
        }

        .tool-card {
            background: var(--bg-card);
            border-radius: var(--radius-xl);
            padding: var(--space-6);
            border: 1px solid var(--border-light);
            transition: all var(--duration-base);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden
        }

        .tool-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-xl);
            border-color: var(--accent-primary)
        }

        .tool-category {
            display: inline-flex;
            padding: var(--space-1) var(--space-3);
            background: var(--interactive-hover);
            border-radius: var(--radius-full);
            font-size: var(--text-xs);
            font-weight: 600;
            color: var(--accent-primary);
            margin-bottom: var(--space-3)
        }

        .tool-name {
            font-size: var(--text-xl);
            font-weight: 700;
            margin-bottom: var(--space-3)
        }

        .tool-description {
            color: var(--text-secondary);
            font-size: var(--text-sm);
            line-height: 1.7;
            margin-bottom: var(--space-4);
            flex-grow: 1
        }

        .tool-actions {
            display: flex;
            gap: var(--space-2);
            margin-top: auto
        }

        .tool-actions .btn {
            flex: 1
        }

        .no-results {
            text-align: center;
            padding: var(--space-16);
            color: var(--text-tertiary)
        }
    </style>
</head>

<body>

    <div id="site-header"></div>
    <script src="assets/js/header.js"></script>

    <section class="tools-hero">
        <div class="container">
            <h1 class="hero-title animate-fade-in-up"
                style="font-size:clamp(2rem,5vw,3.5rem);margin-bottom:var(--space-4)">Discover 150+ Tools</h1>
            <div class="search-box animate-fade-in-up stagger-2">
                <input type="text" class="search-input" id="searchInput"
                    placeholder="Search tools, categories, keywords..." autocomplete="off">
                <button class="search-btn" id="searchBtn">🔍</button>
            </div>
        </div>
    </section>

    <section class="filters-section">
        <div class="container">
            <div class="filters-wrapper">
                <select class="filter-select" id="categoryFilter"></select>
                <select class="filter-select" id="sortFilter">
                    <option value="name-asc">Name (A-Z)</option>
                    <option value="name-desc">Name (Z-A)</option>
                    <option value="category">Category</option>
                </select>
                <div style="margin-left:auto;font-size:var(--text-sm);color:var(--text-tertiary)">Showing <strong
                        id="resultsCount">0</strong> tools</div>
            </div>
        </div>
    </section>

    <section class="container" style="min-height: 80vh;">
        <div class="tools-grid" id="toolsGrid"></div>
        <div class="no-results" id="noResults" style="display:none">
            <h3>No tools found</h3>
        </div>
    </section>

    <div id="site-footer"></div>
    <script src="assets/js/footer.js"></script>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/database.js"></script>
    <script type="module" src="assets/js/firebase.js"></script>

    <script>
        const searchInput = document.getElementById('searchInput'), categoryFilter = document.getElementById('categoryFilter'), sortFilter = document.getElementById('sortFilter'), toolsGrid = document.getElementById('toolsGrid'), resultsCount = document.getElementById('resultsCount'), noResults = document.getElementById('noResults');
        let currentTools = [];

        document.addEventListener('DOMContentLoaded', () => {
            const categories = window.DB_HELPERS.getCategories();
            categoryFilter.innerHTML = categories.map(c => `<option value="${c}">${c}</option>`).join('');
            currentTools = window.DB_HELPERS.getAllTools();
            renderTools(currentTools);
        });

        searchInput.addEventListener('input', e => { setTimeout(() => handleSearch(), 300); });
        categoryFilter.addEventListener('change', handleFilter);
        sortFilter.addEventListener('change', handleFilter);

        function handleSearch() {
            const q = searchInput.value.trim(), cat = categoryFilter.value;
            let results = window.DB_HELPERS.searchTools(q);
            if (cat !== 'All Categories') results = results.filter(t => t.category === cat);
            currentTools = results; sortTools(); renderTools(currentTools);
        }

        function handleFilter() { handleSearch(); }

        function sortTools() {
            const v = sortFilter.value;
            currentTools.sort((a, b) => v === 'name-asc' ? a.name.localeCompare(b.name) : v === 'name-desc' ? b.name.localeCompare(a.name) : a.category.localeCompare(b.category));
        }

        function renderTools(tools) {
            resultsCount.textContent = tools.length;
            if (tools.length === 0) { toolsGrid.innerHTML = ''; noResults.style.display = 'block'; return }
            noResults.style.display = 'none';
            toolsGrid.innerHTML = tools.map((t, i) => `
                <div class="tool-card" style="animation:fadeInUp 0.5s ${i * 0.03}s both">
                    <span class="tool-category">${t.category}</span>
                    <h3 class="tool-name">${t.name}</h3>
                    <p class="tool-description">${t.description}</p>
                    <div class="tool-actions">
                        <a href="tool.html?name=${encodeURIComponent(t.name)}" class="btn btn-secondary">Details</a>
                        <a href="/redirect.html?url=${encodeURIComponent(t.link)}" target="_blank" class="btn btn-primary">Visit →</a>
                    </div>
                </div>
            `).join('');
        }
    </script>
    <script src="assets/js/bonus-ad.js"></script>
    <div id="adblockModal" class="adblock-overlay">
        <div class="adblock-card">
            <div class="adblock-icon">🛑</div>
            <h2 class="adblock-title">Adblocker Detected</h2>
            <p class="adblock-text">
                We noticed you are using an adblocker. The <strong>AI Tools Hub</strong> is kept free and maintained
                through display ads. Please consider disabling your adblocker or whitelisting our site to support us!
            </p>
            <div class="adblock-buttons">
                <button class="btn btn-primary" onclick="window.location.reload()">I've Disabled It (Refresh)</button>
                <!--<button class="btn btn-ghost" onclick="dismissAdblock()">Continue anyway</button>-->
            </div>
        </div>
    </div>

    <style>
        /* Adblock Modal Styles */
        .adblock-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .adblock-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .adblock-card {
            background: var(--bg-card, #1e1e2e);
            /* Falls back to dark gray if var fails */
            padding: 40px;
            border-radius: var(--radius-2xl, 16px);
            border: 1px solid var(--border-light, #333);
            max-width: 450px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            transform: translateY(20px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .adblock-overlay.show .adblock-card {
            transform: translateY(0);
        }

        .adblock-icon {
            font-size: 3rem;
            margin-bottom: 20px;
        }

        .adblock-title {
            color: var(--text-primary, #fff);
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .adblock-text {
            color: var(--text-secondary, #aaa);
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .adblock-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
    </style>
    <script src="assets/js/detector.js"></script>
</body>

</html>
