<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Browse 150+ curated AI tools, OSINT resources, development tools and more. Filter by category, search instantly.">
    
    <title>Browse Tools - AI Tools Hub</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
    
    <!-- Styles -->
    <link rel="stylesheet" href="assets/css/themes.css">
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/animations.css">
    
    <style>
        /* Page-specific styles */
        .tools-hero {
            padding: 120px 0 60px;
            background: var(--bg-gradient-hero);
            text-align: center;
        }
        
        .search-container {
            max-width: 700px;
            margin: 0 auto;
        }
        
        .search-box {
            display: flex;
            background: var(--bg-card);
            border-radius: var(--radius-2xl);
            box-shadow: var(--shadow-xl);
            overflow: hidden;
            border: 2px solid var(--border-light);
            transition: all var(--duration-base) var(--ease-smooth);
        }
        
        .search-box:focus-within {
            border-color: var(--accent-primary);
            box-shadow: var(--shadow-primary);
        }
        
        .search-input {
            flex: 1;
            padding: var(--space-5) var(--space-6);
            border: none;
            background: transparent;
            font-size: var(--text-lg);
            font-family: var(--font-primary);
            color: var(--text-primary);
            outline: none;
        }
        
        .search-input::placeholder {
            color: var(--text-muted);
        }
        
        .search-btn {
            padding: var(--space-4) var(--space-6);
            background: var(--bg-gradient-1);
            border: none;
            color: white;
            font-size: var(--text-xl);
            cursor: pointer;
            transition: all var(--duration-fast) var(--ease-smooth);
        }
        
        .search-btn:hover {
            opacity: 0.9;
        }
        
        .filters-section {
            padding: var(--space-6) 0;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-light);
            position: sticky;
            top: 72px;
            z-index: var(--z-sticky);
            backdrop-filter: blur(10px);
        }
        
        .filters-wrapper {
            display: flex;
            gap: var(--space-4);
            align-items: center;
            flex-wrap: wrap;
        }
        
        .filter-group {
            display: flex;
            gap: var(--space-2);
            align-items: center;
        }
        
        .filter-label {
            font-weight: 600;
            color: var(--text-secondary);
            font-size: var(--text-sm);
        }
        
        .filter-select {
            padding: var(--space-2) var(--space-4);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            background: var(--bg-card);
            font-family: var(--font-primary);
            font-size: var(--text-sm);
            color: var(--text-primary);
            cursor: pointer;
            outline: none;
            transition: all var(--duration-fast) var(--ease-smooth);
        }
        
        .filter-select:focus {
            border-color: var(--accent-primary);
        }
        
        .results-info {
            margin-left: auto;
            font-size: var(--text-sm);
            color: var(--text-tertiary);
        }
        
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: var(--space-6);
            padding: var(--space-10) 0;
        }
        
        .tool-card {
            background: var(--bg-card);
            border-radius: var(--radius-xl);
            padding: var(--space-6);
            border: 1px solid var(--border-light);
            transition: all var(--duration-base) var(--ease-smooth);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        
        .tool-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--bg-gradient-1);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform var(--duration-base) var(--ease-smooth);
        }
        
        .tool-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-xl);
            border-color: var(--accent-primary);
        }
        
        .tool-card:hover::before {
            transform: scaleX(1);
        }
        
        .tool-category {
            display: inline-flex;
            align-items: center;
            gap: var(--space-2);
            padding: var(--space-1) var(--space-3);
            background: var(--interactive-hover);
            border-radius: var(--radius-full);
            font-size: var(--text-xs);
            font-weight: 600;
            color: var(--accent-primary);
            margin-bottom: var(--space-3);
            width: fit-content;
        }
        
        .tool-name {
            font-size: var(--text-xl);
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: var(--space-3);
            line-height: 1.3;
        }
        
        .tool-description {
            color: var(--text-secondary);
            font-size: var(--text-sm);
            line-height: 1.7;
            margin-bottom: var(--space-4);
            flex-grow: 1;
        }
        
        .tool-tags {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-2);
            margin-bottom: var(--space-4);
        }
        
        .tool-tag {
            padding: var(--space-1) var(--space-3);
            background: var(--bg-tertiary);
            border-radius: var(--radius-full);
            font-size: var(--text-xs);
            color: var(--text-tertiary);
            transition: all var(--duration-fast) var(--ease-smooth);
        }
        
        .tool-tag:hover {
            background: var(--interactive-active);
            color: var(--accent-primary);
        }
        
        .tool-actions {
            display: flex;
            gap: var(--space-2);
            margin-top: auto;
        }
        
        .tool-actions .btn {
            flex: 1;
        }
        
        .btn-icon {
            padding: var(--space-3);
            min-width: auto;
            flex: 0;
        }
        
        .no-results {
            text-align: center;
            padding: var(--space-16) var(--space-4);
            color: var(--text-tertiary);
        }
        
        .no-results-icon {
            font-size: 4rem;
            margin-bottom: var(--space-4);
        }
        
        .no-results-title {
            font-size: var(--text-2xl);
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: var(--space-2);
        }
        
        /* Loading skeleton */
        .skeleton-card {
            background: var(--bg-card);
            border-radius: var(--radius-xl);
            padding: var(--space-6);
            border: 1px solid var(--border-light);
        }
        
        .skeleton-category {
            width: 100px;
            height: 24px;
            margin-bottom: var(--space-3);
        }
        
        .skeleton-title {
            width: 70%;
            height: 28px;
            margin-bottom: var(--space-3);
        }
        
        .skeleton-text {
            height: 16px;
            margin-bottom: var(--space-2);
        }
        
        .skeleton-text:last-child {
            width: 60%;
        }
        
        @media (max-width: 768px) {
            .tools-hero {
                padding: 100px 0 40px;
            }
            
            .filters-wrapper {
                flex-direction: column;
                align-items: stretch;
            }
            
            .results-info {
                margin-left: 0;
                margin-top: var(--space-2);
            }
            
            .tools-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    
    <!-- HEADER -->
    <header class="header theme-transition" id="header">
        <nav class="nav container">
            <a href="/" class="logo">AI Tools Hub</a>
            <ul class="nav-links">
                <li><a href="/" class="nav-link">Home</a></li>
                <li><a href="tools.html" class="nav-link active">Tools</a></li>
                <li><a href="about.html" class="nav-link">About</a></li>
                <li><a href="contact.html" class="nav-link">Contact</a></li>
                <li data-auth-button><a href="login.html" class="btn btn-primary">Get Started</a></li>
                <li data-user-menu style="display: none;">
                    <div style="display: flex; align-items: center; gap: 0.5rem;">
                        <span data-user-name style="font-weight: 500;"></span>
                        <button onclick="FirebaseService.logOut()" class="btn btn-ghost">Logout</button>
                    </div>
                </li>
            </ul>
        </nav>
    </header>

    <!-- HERO / SEARCH -->
    <section class="tools-hero">
        <div class="container">
            <h1 class="hero-title animate-fade-in-up" style="font-size: clamp(2rem, 5vw, 3.5rem); margin-bottom: var(--space-4);">
                Discover 150+ Tools
            </h1>
            <p class="hero-subtitle animate-fade-in-up stagger-1" style="margin-bottom: var(--space-8);">
                Search, filter, and find the perfect tool for your needs
            </p>
            
            <div class="search-container animate-fade-in-up stagger-2">
                <div class="search-box">
                    <input 
                        type="text" 
                        class="search-input" 
                        id="searchInput"
                        placeholder="Search tools, categories, keywords..."
                        autocomplete="off"
                    >
                    <button class="search-btn" id="searchBtn">🔍</button>
                </div>
            </div>
        </div>
    </section>

    <!-- FILTERS -->
    <section class="filters-section">
        <div class="container">
            <div class="filters-wrapper">
                <div class="filter-group">
                    <span class="filter-label">Category:</span>
                    <select class="filter-select" id="categoryFilter">
                        <option value="All Categories">All Categories</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <span class="filter-label">Sort by:</span>
                    <select class="filter-select" id="sortFilter">
                        <option value="name-asc">Name (A-Z)</option>
                        <option value="name-desc">Name (Z-A)</option>
                        <option value="category">Category</option>
                    </select>
                </div>
                
                <div class="results-info">
                    Showing <strong id="resultsCount">0</strong> tools
                </div>
            </div>
        </div>
    </section>

    <!-- TOOLS GRID -->
    <section class="container">
        <div class="tools-grid" id="toolsGrid">
            <!-- Loading skeletons -->
            <div class="skeleton-card">
                <div class="skeleton skeleton-category"></div>
                <div class="skeleton skeleton-title"></div>
                <div class="skeleton skeleton-text"></div>
                <div class="skeleton skeleton-text"></div>
                <div class="skeleton skeleton-text"></div>
            </div>
            <div class="skeleton-card">
                <div class="skeleton skeleton-category"></div>
                <div class="skeleton skeleton-title"></div>
                <div class="skeleton skeleton-text"></div>
                <div class="skeleton skeleton-text"></div>
                <div class="skeleton skeleton-text"></div>
            </div>
            <div class="skeleton-card">
                <div class="skeleton skeleton-category"></div>
                <div class="skeleton skeleton-title"></div>
                <div class="skeleton skeleton-text"></div>
                <div class="skeleton skeleton-text"></div>
                <div class="skeleton skeleton-text"></div>
            </div>
        </div>
        
        <!-- No Results -->
        <div class="no-results" id="noResults" style="display: none;">
            <div class="no-results-icon">🔍</div>
            <h3 class="no-results-title">No tools found</h3>
            <p>Try adjusting your search or filter criteria</p>
        </div>
    </section>

    <!-- Footer -->
    <footer style="background: var(--bg-tertiary); padding: 40px 20px; margin-top: 60px; text-align: center;">
        <p style="color: var(--text-tertiary); font-size: 0.9rem;">
            © 2024 AI Tools Hub. Created by <strong style="color: var(--accent-primary);">NinjaCoder-X</strong>
        </p>
    </footer>

    <!-- Scripts -->
    <script src="assets/js/config.js"></script>
    <script src="assets/js/database.js"></script>
    
    <script>
        // DOM Elements
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const categoryFilter = document.getElementById('categoryFilter');
        const sortFilter = document.getElementById('sortFilter');
        const toolsGrid = document.getElementById('toolsGrid');
        const resultsCount = document.getElementById('resultsCount');
        const noResults = document.getElementById('noResults');
        const header = document.getElementById('header');
        
        // State
        let currentTools = [];
        let favorites = new Set();
        
        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            // Populate categories
            const categories = window.DB_HELPERS.getCategories();
            categoryFilter.innerHTML = categories.map(cat => 
                `<option value="${cat}">${cat}</option>`
            ).join('');
            
            // Load all tools
            currentTools = window.DB_HELPERS.getAllTools();
            renderTools(currentTools);
            
            // Check URL params
            const params = new URLSearchParams(window.location.search);
            const searchParam = params.get('search');
            const categoryParam = params.get('category');
            
            if (searchParam) {
                searchInput.value = searchParam;
                handleSearch();
            }
            
            if (categoryParam) {
                categoryFilter.value = categoryParam;
                handleFilter();
            }
        });
        
        // Header scroll effect
        window.addEventListener('scroll', () => {
            if (window.scrollY > 50) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
        });
        
        // Search functionality
        let searchTimeout;
        searchInput.addEventListener('input', () => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(handleSearch, 300);
        });
        
        searchBtn.addEventListener('click', handleSearch);
        
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSearch();
        });
        
        function handleSearch() {
            const query = searchInput.value.trim();
            const category = categoryFilter.value;
            
            let results = window.DB_HELPERS.searchTools(query);
            
            if (category !== 'All Categories') {
                results = results.filter(tool => tool.category === category);
            }
            
            currentTools = results;
            sortTools();
            renderTools(currentTools);
        }
        
        // Filter functionality
        categoryFilter.addEventListener('change', handleFilter);
        sortFilter.addEventListener('change', handleFilter);
        
        function handleFilter() {
            const query = searchInput.value.trim();
            const category = categoryFilter.value;
            
            let results = query 
                ? window.DB_HELPERS.searchTools(query)
                : window.DB_HELPERS.getAllTools();
            
            if (category !== 'All Categories') {
                results = results.filter(tool => tool.category === category);
            }
            
            currentTools = results;
            sortTools();
            renderTools(currentTools);
        }
        
        function sortTools() {
            const sortValue = sortFilter.value;
            
            currentTools.sort((a, b) => {
                switch (sortValue) {
                    case 'name-asc':
                        return a.name.localeCompare(b.name);
                    case 'name-desc':
                        return b.name.localeCompare(a.name);
                    case 'category':
                        return a.category.localeCompare(b.category);
                    default:
                        return 0;
                }
            });
        }
        
        // Render tools
        function renderTools(tools) {
            resultsCount.textContent = tools.length;
            
            if (tools.length === 0) {
                toolsGrid.innerHTML = '';
                noResults.style.display = 'block';
                return;
            }
            
            noResults.style.display = 'none';
            
            toolsGrid.innerHTML = tools.map((tool, index) => `
                <div class="tool-card reveal" style="animation-delay: ${index * 0.05}s;">
                    <span class="tool-category">
                        ${getCategoryIcon(tool.category)} ${tool.category}
                    </span>
                    <h3 class="tool-name">${escapeHtml(tool.name)}</h3>
                    <p class="tool-description">${escapeHtml(tool.description)}</p>
                    <div class="tool-tags">
                        ${tool.tags.slice(0, 4).map(tag => 
                            `<span class="tool-tag">${escapeHtml(tag)}</span>`
                        ).join('')}
                    </div>
                    <div class="tool-actions">
                        <a href="${tool.link}" target="_blank" rel="noopener" class="btn btn-primary btn-animated">
                            Visit Tool →
                        </a>
                        <button class="btn btn-secondary btn-icon" onclick="toggleFavorite('${escapeHtml(tool.name)}')" title="Save to favorites">
                            ${favorites.has(tool.name) ? '❤️' : '🤍'}
                        </button>
                        <button class="btn btn-secondary btn-icon" onclick="shareTool('${escapeHtml(tool.name)}', '${tool.link}')" title="Share">
                            📤
                        </button>
                    </div>
                </div>
            `).join('');
            
            // Trigger reveal animations
            setTimeout(() => {
                document.querySelectorAll('.reveal').forEach(el => {
                    el.classList.add('active');
                });
            }, 100);
        }
        
        // Helper functions
        function getCategoryIcon(category) {
            const icons = {
                'AI': '🤖',
                'Development': '💻',
                'Design': '🎨',
                'OSINT': '🔍',
                'Security': '🔒',
                'Business': '💼',
                'Productivity': '⚡',
                'Learning': '📚',
                'Video': '🎬',
                'Audio': '🎵',
                'Social': '📱'
            };
            
            for (const [key, icon] of Object.entries(icons)) {
                if (category.toLowerCase().includes(key.toLowerCase())) {
                    return icon;
                }
            }
            return '🔧';
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function toggleFavorite(toolName) {
            if (favorites.has(toolName)) {
                favorites.delete(toolName);
            } else {
                favorites.add(toolName);
            }
            renderTools(currentTools);
        }
        
        function shareTool(name, link) {
            if (navigator.share) {
                navigator.share({
                    title: name,
                    text: `Check out ${name} on AI Tools Hub!`,
                    url: link
                });
            } else {
                // Fallback: copy to clipboard
                navigator.clipboard.writeText(link).then(() => {
                    alert('Link copied to clipboard!');
                });
            }
        }
    </script>

</body>
</html>
