<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Tool Details - AI Tools Hub</title>
    <link rel="stylesheet" href="assets/css/themes.css">
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/animations.css">
    </head>
<body>
    
    <div id="site-header"></div>
    <script src="assets/js/header.js"></script>

    <div class="modal" id="collectionModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Add to Collection</h3>
                <button class="modal-close" onclick="closeCollectionModal()">×</button>
            </div>
            <div id="collectionList" style="display:flex; flex-direction:column; gap:var(--space-3); max-height: 300px; overflow-y: auto;">
                </div>
        </div>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/database.js"></script>
    <script type="module" src="assets/js/firebase.js"></script>
    
    <script type="module">
        let currentTool = null;
        const urlParams = new URLSearchParams(window.location.search);
        const toolName = urlParams.get('name');
        
        if (!toolName) window.location.href = '/tools.html';
        
        document.addEventListener('DOMContentLoaded', () => {
            currentTool = window.DB_HELPERS.getToolByName(toolName);
            // ... (keep the rest of your loadToolData logic here) ...
        });

        // The Fixed Collection Logic
        window.showAddToCollection = async () => {
            if (!window.FirebaseService?.isReady || !window.FirebaseService.getCurrentUser()) {
                alert('Please sign in to add tools to collections');
                window.location.href = '/login.html';
                return;
            }
            
            const modal = document.getElementById('collectionModal');
            const list = document.getElementById('collectionList');
            list.innerHTML = '<div style="text-align:center; padding:var(--space-4);">Loading...</div>';
            modal.classList.add('show');
            
            try {
                const collections = await window.FirebaseService.getCollections();
                if (collections.length === 0) {
                    list.innerHTML = `<div style="text-align:center; padding:var(--space-4); color:var(--text-secondary);">You don't have any collections yet.<br><br><a href="profile.html" class="btn btn-primary" style="margin-top:var(--space-4);">Create Collection</a></div>`;
                    return;
                }
                list.innerHTML = collections.map(col => `
                    <button class="btn btn-secondary" style="justify-content:flex-start; text-align:left; width:100%;" onclick="addToolToCol(event, '${col.id}')">
                        <span style="font-size:1.5rem; margin-right:var(--space-3);">${col.icon || '📁'}</span>
                        <div><div style="font-weight:600;">${col.name}</div><div style="font-size:var(--text-xs); color:var(--text-tertiary);">${col.tools?.length || 0} tools</div></div>
                    </button>
                `).join('');
            } catch (e) {
                list.innerHTML = '<div style="color:var(--accent-error);">Error loading collections</div>';
            }
        };

        window.closeCollectionModal = () => document.getElementById('collectionModal').classList.remove('show');

        window.addToolToCol = async (event, colId) => {
            const btn = event.currentTarget;
            const originalText = btn.innerHTML;
            btn.innerHTML = 'Adding...'; btn.disabled = true;
            try {
                const res = await window.FirebaseService.addToolToCollection(colId, currentTool);
                if (res.success) { btn.innerHTML = '✅ Added!'; setTimeout(closeCollectionModal, 1000); } 
                else { alert('Error: ' + res.error); btn.innerHTML = originalText; btn.disabled = false; }
            } catch (e) { alert('Error adding tool'); btn.innerHTML = originalText; btn.disabled = false; }
        };
    </script>
</body>
</html>
