    <script type="module">

        // Fixed Delete Account Logic
        window.confirmDeleteAccount = async (event) => {
            if (confirm('Are you absolutely sure? This action cannot be undone!')) {
                if (confirm('Last chance! Delete your account permanently?')) {
                    const btn = event.currentTarget;
                    btn.disabled = true;
                    btn.textContent = 'Deleting...';
                    
                    try {
                        const result = await window.FirebaseService.deleteAccount();
                        if (result.success) {
                            alert('Account successfully deleted. We are sorry to see you go.');
                            localStorage.removeItem('cachedUser');
                            window.location.href = '/';
                        } else {
                            alert('Error: ' + result.error);
                            btn.disabled = false;
                            btn.textContent = 'Delete My Account';
                        }
                    } catch (error) {
                        alert('An error occurred. Please try again.');
                        btn.disabled = false;
                        btn.textContent = 'Delete My Account';
                    }
                }
            }
        };
    </script>
